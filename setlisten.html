<!DOCTYPE html>
<!-- Setlisten-Planer für den Admin-Bereich (wird in admin.html unter "Setlisten" angezeigt).
     Daten: Firestore-Dokument setlist/state — nur für eingeloggte Admins (siehe README, Abschnitt 9.3). -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Setlisten-Planer — Who Knows?</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
<meta name="theme-color" content="#14100c">
<!-- Firebase: gleicher Login & gleiche Datenbank wie der Admin-Bereich -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js"></script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#120e0b;--panel:#1c1612;--panel2:#271f19;--line:#3a2e25;--text:#efe6d6;--mute:#a7978a;--acc:#b5472b;--acc2:#d9a441;--red:#e0623f;--ok:#8fbf6a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'Work Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line);background:#0e0b09;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{font-family:Anton,Impact,sans-serif;font-size:24px;letter-spacing:.5px;color:var(--text);line-height:1}
.logo span{color:var(--acc2);font-size:14px;letter-spacing:2px;margin-left:8px;vertical-align:middle}
nav{display:flex;gap:4px}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--mute);cursor:pointer;font-weight:600}
nav button.on{background:var(--panel2);color:var(--acc2)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.who select{width:auto;padding:6px 10px;font-weight:600;color:var(--acc)}
.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pickgrid .btn{padding:16px;font-size:17px}
.status{font-size:12px;color:var(--mute)}
main{padding:18px 20px 60px}
.embedded header{position:static;padding:8px 14px;background:transparent;border-bottom:1px solid var(--line)}
.embedded .logo{display:none}
.embedded main{padding:14px 14px 40px}
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#44444f}
.btn.pri{background:var(--acc);color:#fff4e6;border-color:var(--acc);font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.4px}
.btn.pri:hover{background:#c9583a}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 9px;font-size:13px}
.ico{background:none;border:0;color:var(--mute);cursor:pointer;padding:4px 7px;border-radius:6px;font-size:15px}
.ico:hover{background:var(--panel2);color:var(--text)}
input[type=text],input[type=date],input[type=number],input[type=search],textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
label.f{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:4px}
.grid3{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:18px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.aside h3,.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.setlink{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer;margin-bottom:3px}
.setlink:hover{background:var(--panel2)}
.setlink.on{background:var(--panel2);border-color:var(--acc2)}
.setlink b{display:block;font-weight:600}
.fromtag{display:inline-block;font-size:11px;color:var(--acc2);border:1px solid #6b5226;border-radius:5px;padding:0 6px;margin:2px 6px 2px 0}
.mgrid .check.dis{opacity:.45}
.setlink small{color:var(--mute);font-size:12px}
.fields{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:10px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stats{color:var(--mute);font-size:13px;margin:0 0 10px}
.stats b{color:var(--text)}
ol.items{list-style:none;margin:0;padding:0}
.it{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 8px;margin-bottom:6px}
.it.sortable-ghost{opacity:.35}
.it.sortable-chosen{border-color:var(--acc)}
.handle{cursor:grab;color:#5c5c68;padding:2px 4px;user-select:none;font-size:18px;line-height:1}
.nr{font-family:Anton,Impact,sans-serif;font-size:22px;color:var(--acc);width:30px;text-align:right;flex:none}
.it .main{flex:1;min-width:0}
.it .t{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:17px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .a{color:var(--mute);font-weight:400}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:#c4c4cf}
.chip.p{border-color:#6b5226;color:var(--acc2)}
.note{background:transparent!important;border:0!important;border-bottom:1px dashed var(--line)!important;border-radius:0!important;padding:2px 0!important;font-size:13px;color:#c4c4cf;margin-top:3px}
.it.brk{background:transparent;border-style:dashed;border-color:#4a3b16}
.it.brk{border-color:var(--sc,#4a3b16);background:color-mix(in srgb,var(--sc,#f5a524) 12%,transparent)}
.it.brk.enc{border-style:solid}
.it.brk .star{color:#e0623f;font-size:18px}
.it.brk.enc input{color:#e0623f!important}
.encbtn{color:#e0623f;border-color:#5a2a1c}
.it.brk input{color:var(--sc,var(--acc))!important;background:transparent;border:0;font-family:Anton,Impact,sans-serif;font-size:20px;letter-spacing:1px;color:var(--acc);padding:2px 0}
.brk .sub{font-size:12px;color:var(--mute);white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:10px}
.lib{max-height:60vh;overflow:auto;margin-top:8px}
.libit{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer}
.libit:hover{background:var(--panel2)}
.libit .main{flex:1;min-width:0}
.libit .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libit small{color:var(--mute)}
.libit .in{color:var(--ok);font-size:13px}
.libit .plus{color:var(--acc2);font-weight:700}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:8px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:50px 14px;z-index:50;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:560px}
.modal h2{margin:0 0 14px;font-size:20px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid .full{grid-column:1/-1}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.mfoot .left{margin-right:auto}
.check{display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
.check input{width:auto;accent-color:var(--acc)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);padding:10px 16px;border-radius:10px;z-index:80;font-weight:600}
.stage{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;user-select:none}
.stage .top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;color:#777;font-size:14px}
.stage .cur{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px 20px;cursor:pointer}
.stage .big{font-family:Anton,Impact,sans-serif;font-size:clamp(48px,11vw,150px);line-height:.95;color:#fff}
.stage .bnr{font-family:Anton,Impact,sans-serif;font-size:clamp(28px,5vw,60px);color:var(--acc)}
.stage .meta{margin-top:14px;font-size:clamp(16px,2.6vw,30px);color:var(--acc2)}
.stage .snote{margin-top:8px;font-size:clamp(14px,2vw,22px);color:#aaa}
.stage .next{padding:16px 20px;border-top:1px solid #222;color:#888;font-size:clamp(16px,2.4vw,26px);text-align:center}
.stage .next b{color:#ddd}
.stage .nav{display:flex;gap:10px;justify-content:center;padding:0 0 18px}
.stage .nav .btn{background:#111;border-color:#333;font-size:18px;padding:12px 26px}
.mylink{display:block;background:none;border:0;color:var(--acc2);font-size:13px;padding:4px 0 0;cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.myrow{display:flex;align-items:center;gap:10px;margin-top:5px;min-width:0}
.ctrlbox{display:flex;align-items:center;flex:none;border:1px solid #6a2a1a;border-radius:6px;overflow:hidden;background:#1a0f0b}
.ctrlbox span{background:#b5472b;color:#fff4e6;font-family:Anton,Impact,sans-serif;font-size:12px;letter-spacing:.5px;padding:3px 6px}
.ctrlbox input::placeholder{color:#6a4a3e}
.ctrlbox input{border:0!important;background:transparent!important;width:120px!important;padding:3px 7px!important;font-size:13px;font-weight:700;color:#ff7a5c!important;border-radius:0!important}
.myrow .mylink{padding:0;min-width:0}
.stage .ctrl{margin-top:14px;font-weight:800;color:#ff5a3c;font-size:clamp(18px,3vw,36px)}
.mylink:hover{text-decoration:underline}
.mynote{font-family:ui-monospace,Menlo,Consolas,monospace!important;font-size:13px;margin-top:6px;white-space:pre;overflow-x:auto;resize:vertical}
.stage .chords{margin-top:16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(15px,2.2vw,26px);color:#ddd;white-space:pre;text-align:left;max-width:95vw;overflow:auto}
.acts{display:flex;align-items:center;gap:2px;flex:none}
.robar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:rgba(217,164,65,.1);border:1px solid #6b5226;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px;color:var(--acc2)}
.ro .fields input,.ro .note,.ro .it.brk input{pointer-events:none;opacity:.75}
.ro .acts,.ro .handle,.ro .toolbar .sec:not([data-act=copyText]),.ro [data-act=addBreak],.ro [data-act=addEncore]{display:none!important}
.fromtag.owntag{color:var(--text);border-color:var(--line)}
.setpick,.morebtn,.fab,.mob{display:none}
.sheetlist{display:grid;gap:8px}
.sheetbtn{width:100%;text-align:left;padding:13px 14px;font-size:15px}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheethead h2{margin:0}
.pdfprev{width:100%;max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#3a302a;padding:12px;text-align:center}
.pdfprev canvas{display:block;margin:0 auto 12px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.pvmsg{color:var(--text);padding:60px 10px;line-height:1.6}
.modal:has(.pdfprev){max-width:760px}
@media (max-width:1000px){.grid3{grid-template-columns:minmax(0,1fr)}.fields{grid-template-columns:1fr 1fr}.fields>div:first-child{grid-column:1/-1}.lib{max-height:40vh}}
@media (max-width:700px){
  html,body{overflow-x:hidden}
  input[type=text],input[type=date],input[type=number],input[type=search],textarea,select{font-size:16px}
  header{gap:8px 10px;padding:8px 12px}
  .logo{font-size:19px}.logo span{display:none}
  nav button{padding:7px 10px;font-size:14px}
  .who{font-size:0;gap:0;margin-left:auto}.who select{padding:6px 8px;font-size:15px}
  #nav{flex:1;min-width:0}
  .toolbar{display:grid;grid-template-columns:1fr 1fr auto}
  .toolbar .btn{font-size:14px;text-align:center}
  .status{flex-basis:100%;margin:0;text-align:right;font-size:11px}
  .status:not(.warn){display:none}
  .status.warn{color:#ff9a7a}
  main{padding:10px 10px 90px}
  .grid3{gap:12px}
  .card{padding:12px;border-radius:10px}
  .aside{display:none}
  .grid3>.card:last-child:not(:only-child){display:none}
  .setpick{display:flex;gap:8px;margin-bottom:12px}
  .setpick select{flex:1;min-width:0;font-weight:600;color:var(--acc2)}
  .fields{grid-template-columns:minmax(0,1fr);gap:8px}
  .fields>div{min-width:0}
  .fields input{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
  main,.embedded main{padding-bottom:110px}
  .toolbar{gap:6px}
  .toolbar .btn{padding:9px 11px}
  .toolbar .sec{display:none}
  .morebtn{display:inline-block}
  .fab{display:block;position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:40;padding:14px;border-radius:12px;border:0;background:var(--acc);color:#fff4e6;font-family:Anton,Impact,sans-serif;font-size:17px;letter-spacing:.4px;box-shadow:0 6px 22px rgba(0,0,0,.55);cursor:pointer}
  .desk{display:none}.mob{display:inline}
  .it{flex-wrap:wrap;padding:8px 8px 6px;gap:4px 6px;align-items:flex-start}
  .it .handle{padding:6px 2px;font-size:20px;touch-action:none}
  .nr{width:26px;font-size:21px;padding-top:2px}
  .it .main{flex:1 1 0;min-width:0}
  .it .t{white-space:normal;font-size:16px;line-height:1.25}
  .it .a{font-size:13px}
  .acts{width:100%;justify-content:flex-end;gap:4px;border-top:1px solid rgba(255,255,255,.05);padding-top:4px}
  .ico{min-width:40px;min-height:36px;font-size:17px;border:1px solid var(--line);border-radius:8px}
  .ico.del{color:#e0623f}
  .it.brk{flex-wrap:wrap;align-items:center}
  .it.brk .main{flex:1 1 0}
  .it.brk .acts{width:auto;border-top:0;padding-top:0}
  .it.brk .sub{flex-basis:100%;order:5;padding-left:28px}
  .myrow{flex-wrap:wrap;gap:6px 10px}
  .ctrlbox input{width:150px!important}
  .mylink{white-space:normal;padding:6px 0 2px}
  .hide-s{display:none}.mgrid{grid-template-columns:1fr}
  td{padding:10px 6px}
  .modal-bg{padding:10px;align-items:flex-start}
  .modal{padding:16px;border-radius:12px}
  .mfoot{flex-wrap:wrap}
  .mfoot .btn{flex:1 1 auto;text-align:center}
  .mfoot .left{flex-basis:100%;margin-right:0}
  .morebtn{font-size:20px!important;line-height:1;padding:6px 14px!important}
  .modal-bg.sheet{padding:0}
  .modal-bg.sheet .modal{max-width:none;min-height:100dvh;border-radius:0;border:0;padding:14px 12px}
  .sheetlib{max-height:none}
  .libit{padding:12px 8px;border-bottom:1px solid var(--line);border-radius:0}
  .pdfprev{max-height:62vh;padding:6px}
  .stage .nav .btn{padding:14px 30px}
}
</style>
</head>
<body>
<header>
  <div class="logo">Who Knows?<span>SETLIST</span></div>
  <nav id="nav">
    <button data-tab="sets">Setlisten</button>
    <button data-tab="songs">Songs</button>
    <button data-tab="settings">Einstellungen</button>
  </nav>
  <div class="who"><span id="whoLabel">Ich bin</span> <select id="who" aria-label="Person / Ansicht"></select></div>
  <div class="status" id="status">Lade…</div>
</header>
<main id="app"></main>
<div id="layer"></div>

<script>
(function(){
"use strict";
try{ if(window.self!==window.top) document.documentElement.classList.add('embedded'); }catch(e){ document.documentElement.classList.add('embedded'); }
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const LS='setlist-planer-v1';

function defPdf(){return {numbers:true,artist:false,key:true,preset:true,tuning:false,bpm:false,dur:false,gigNotes:true,songNotes:false,myNotes:true,ctrl:true,breaks:true,footer:true,size:'auto',layout:'notes',color:true};}
let MEMBERS=['Uli','Nik','Marie','Tobi','Raffa','Tim'];
let me=null; try{ me=localStorage.getItem('setlist-user'); }catch(e){} if(!MEMBERS.includes(me)) me=null;
function getPdfOpts(){ const u=(state.settings.pdfUser||{})[me]; return Object.assign(defPdf(),u||{}); }
function myNote(id){ const m=(state.myNotes||{})[me]; return (m&&m[id])||''; }
function myCtrl(id){ const m=(state.myCtrl||{})[me]; return (m&&m[id])||''; }
function myPreset(id){ const m=(state.myPreset||{})[me]; return (m&&m[id])||''; }
function setMyPreset(id,v){ if(!me) return; state.myPreset=state.myPreset||{}; const m=state.myPreset[me]=state.myPreset[me]||{}; if(v&&String(v).trim()) m[id]=String(v).trim(); else delete m[id]; }
/** Alte, für alle sichtbare Presets (song.preset) einmalig in die persönlichen
 *  Presets einer Person verschieben. Gibt true zurück, wenn etwas geändert wurde. */
function movePresetsTo(person){
  if(!person) return false; let moved=false;
  state.myPreset=state.myPreset||{}; const m=state.myPreset[person]=state.myPreset[person]||{};
  state.songs.forEach(s=>{ if(s.preset){ if(!m[s.id]) m[s.id]=s.preset; delete s.preset; moved=true; } });
  return moved;
}
function setMyCtrl(id,v){ if(!me) return; state.myCtrl=state.myCtrl||{}; const m=state.myCtrl[me]=state.myCtrl[me]||{}; if(v&&v.trim()) m[id]=v; else delete m[id]; }
function setMyNote(id,v){ if(!me) return; state.myNotes=state.myNotes||{}; const m=state.myNotes[me]=state.myNotes[me]||{}; if(v&&v.trim()) m[id]=v; else delete m[id]; }
let RM=null; // Rechte-Modus (Website mit Benutzer & Rechte): {uid, member, owner, others}
const visibleSets=()=>{
  if(RM){ const v=ui.viewOwner; return v==='*'?state.setlists:state.setlists.filter(s=>s.owner===(v||me)); }
  return state.setlists.filter(s=>!s.owner||s.owner===me);
};
const isRO=sl=>!!(RM&&sl&&sl.owner!==me&&!RM.owner);
function defaults(){return {songs:[],setlists:[],myNotes:{},myCtrl:{},myPreset:{},settings:{bandName:'Who Knows?',pdfUser:{}}};}
let state=defaults();
const ui={tab:'sets',setId:null,addQ:'',songQ:'',songSort:'title',viewOwner:null};

/* ---------- helpers ---------- */
function parseDur(v){
  v=String(v||'').trim(); if(!v) return 0;
  const m=v.match(/^(\d+)[:.,](\d{1,2})$/); if(m) return (+m[1])*60+(+m[2]);
  if(/^\d+$/.test(v)){const n=+v; return n<=20?n*60:n;}
  return 0;
}
function fmtDur(s){
  s=Math.round(s||0); if(!s) return '';
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');
  return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`;
}
function fmtDate(d){ if(!d) return ''; const p=d.split('-'); return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:d; }
const songById=id=>state.songs.find(s=>s.id===id);
const curSet=()=>visibleSets().find(s=>s.id===ui.setId);
function setStats(sl){
  let n=0,t=0,missing=0;
  for(const it of sl.items){ if(it.type!=='song') continue; const s=songById(it.songId); if(!s) continue; n++; if(s.dur) t+=s.dur; else missing++; }
  return {n,t,missing};
}
function usage(songId){return state.setlists.filter(sl=>sl.items.some(i=>i.songId===songId)).length;}
function sortedSets(){return visibleSets().slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0));}
function findSongByTitle(t){t=t.trim().toLowerCase(); return state.songs.find(s=>s.title.trim().toLowerCase()===t);}

/* ---------- persistence ---------- */
let db=null,docRef=null,lastJSON='',saveTimer=null,saving=false,again=false,readOnly=false,dirty=false;
function setStatus(t){ const el=$('#status'); el.textContent=t; el.classList.toggle('warn',/Keine|nicht|Nicht|aus –|wackelt|voll/.test(t)); }
function merge(d){
  const def=defaults(); if(!d||typeof d!=='object') return;
  state.songs=Array.isArray(d.songs)?d.songs:[];
  state.setlists=Array.isArray(d.setlists)?d.setlists:[];
  state.setlists.forEach(sl=>{ if(!Array.isArray(sl.items)) sl.items=[]; });
  const st=d.settings||{};
  state.settings=Object.assign(def.settings,st); if(!state.settings.pdfUser||typeof state.settings.pdfUser!=='object') state.settings.pdfUser={};
  state.myNotes=(d.myNotes&&typeof d.myNotes==='object')?d.myNotes:{};
  state.myCtrl=(d.myCtrl&&typeof d.myCtrl==='object')?d.myCtrl:{};
  state.myPreset=(d.myPreset&&typeof d.myPreset==='object')?d.myPreset:{};
}
function saveLocal(){ if(RM) return; try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){} }
function loadLocal(){ try{const s=localStorage.getItem(LS); if(s) merge(JSON.parse(s));}catch(e){} }
function commit(rerender){
  if(rerender!==false) render();
  saveLocal(); dirty=true;
  if(RM){ clearTimeout(saveTimer); saveTimer=setTimeout(rmFlush,700); return; }
  if(!docRef||readOnly){ dirty=false; return; }
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(saving){again=true;return;}
  saving=true; const json=JSON.stringify(state);
  if(json!==lastJSON){
    setStatus('Speichere…');
    try{ await docRef.set({state:json,updated:Date.now()}); lastJSON=json; setStatus('Gespeichert ✓'); }
    catch(e){
      const c=e&&e.code;
      if(c==='invalid_argument'||c==='permission-denied'){ readOnly=true; setStatus(c==='permission-denied'?'Keine Schreibrechte – Firestore-Regeln ergänzen (README)':'Nur Ansicht – Änderungen bleiben lokal'); }
      else if(c==='quota_exceeded'){ setStatus('Speicher voll'); toast('Speicherplatz voll – lösche alte Setlisten.'); }
      else if(c==='unavailable'||c==='deadline-exceeded'){ setTimeout(()=>commit(false),1500); setStatus('Verbindung wackelt…'); }
      else setStatus('Nicht gespeichert (lokal gesichert)');
    }
  }
  saving=false; dirty=false;
  if(again){again=false; flush();}
}
function hasFirebase(){ return typeof fbDb!=='undefined' && fbDb && typeof fbAuth!=='undefined' && fbAuth; }
async function initCloud(){
  // Variante 1: eingebaut in die Band-Website (Firebase / Firestore)
  if(hasFirebase()){
    setStatus('Verbinde …');
    let started=false;
    fbAuth.onAuthStateChanged(async u=>{
      if(!u){ showLoginNeeded(); return; }
      hideLoginNeeded();
      if(started) return; started=true;
      let ownerDoc=null;
      try{ ownerDoc=await fbDb.collection('meta').doc('owner').get(); }catch(e){ ownerDoc=null; }
      if(ownerDoc&&ownerDoc.exists){ await startRights(u,ownerDoc.data()); }
      else { if(!me) pickUser(true); watchDoc(fbDb.collection('setlist').doc('state')); }
    });
    return;
  }
  // Variante 2: als Claude-Artefakt
  if(!window.claude||typeof window.claude.use!=='function'){ setStatus('Lokal gespeichert'); return; }
  try{ db=await window.claude.use('db'); }catch(e){ db=null; }
  if(!db){ setStatus('Lokal gespeichert'); return; }
  watchDoc(db.doc('band/state'));
}
function showLoginNeeded(){
  setStatus('Nicht angemeldet');
  if(document.getElementById('loginNeeded')) return;
  const d=document.createElement('div'); d.id='loginNeeded'; d.className='modal-bg';
  d.innerHTML='<div class="modal" style="text-align:center"><h2>Bitte anmelden</h2><p class="stats">Der Setlisten-Planer ist nur für die Band. Melde dich im Admin-Bereich an.</p><div class="mfoot" style="justify-content:center"><a class="btn pri" href="admin.html#setlisten" target="_top" style="text-decoration:none">Zum Admin-Login</a></div></div>';
  document.body.appendChild(d);
}
function hideLoginNeeded(){ const d=document.getElementById('loginNeeded'); if(d) d.remove(); }
function watchDoc(ref){
  docRef=ref;
  const timer=setTimeout(()=>setStatus('Cloud nicht erreichbar – lokal gespeichert'),10000);
  docRef.onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(timer);
    if(snap.metadata.hasPendingWrites) return;
    if(snap.exists){
      const j=(snap.data()||{}).state;
      if(typeof j==='string'){
        if(j!==lastJSON && !dirty && j!==JSON.stringify(state)){
          try{ merge(JSON.parse(j)); lastJSON=j; saveLocal(); if(!document.activeElement||!document.activeElement.matches('input,textarea')) render(); else pendingRender=true; }catch(e){}
        } else lastJSON=j;
      }
      setStatus('Synchronisiert ✓');
    } else if(!snap.metadata.fromCache){
      setStatus('Bereit');
      if(state.songs.length||state.setlists.length){ dirty=true; flush(); }
    }
  },err=>{ clearTimeout(timer); docRef=null;
    if(err&&err.code==='permission-denied') setStatus('Keine Berechtigung – Firestore-Regeln ergänzen (README)');
    else setStatus('Cloud-Sync aus – lokal gespeichert'); });
}
/* ---------- Rechte-Modus (Login bestimmt die Person) ---------- */
let rmPendingPresets=false, rmNotesLoaded=false, rmLastLib='', rmLastNotes='', rmLastSet={}, rmSetMeta={}, rmSaving=false, rmAgain=false;
const libRef=()=>fbDb.collection('setlist').doc('library');
const setsCol=()=>fbDb.collection('setlists');
const notesRef=()=>fbDb.collection('setlistNotes').doc(me);
function setDocData(sl){ return {owner:sl.owner||me, from:sl.from||'', date:sl.date||'', data:JSON.stringify(sl), updated:Date.now()}; }
function showNoRights(text){
  setStatus('Keine Berechtigung');
  const d=document.createElement('div'); d.className='modal-bg';
  d.innerHTML='<div class="modal" style="text-align:center"><h2>Kein Zugriff auf Setlisten</h2><p class="stats">'+esc(text||'Für deinen Login ist der Bereich „Setlisten“ nicht freigeschaltet. Bitte wende dich an den Superadmin.')+'</p></div>';
  document.body.appendChild(d);
}
async function startRights(u,owner){
  let ud=null; try{ ud=await fbDb.collection('users').doc(u.uid).get(); }catch(e){ ud=null; }
  const d=ud&&ud.exists?ud.data():null;
  const isOwner=owner.uid===u.uid;
  if(!d||!d.member){ showNoRights(isOwner?'Dein Superadmin-Zugang hat noch kein Bandmitglied zugeordnet. Bitte lade die Admin-Konsole neu.':null); return; }
  if(!isOwner&&(d.disabled||!(d.areas||{}).setlisten)){ showNoRights(); return; }
  // Bandmitglieder aus der Admin-Konsole (Benutzer & Rechte)
  try{ const md=await fbDb.collection('meta').doc('members').get(); if(md.exists&&Array.isArray(md.data().list)){ const act=md.data().list.filter(x=>x&&x.name&&x.active!==false).map(x=>x.name); if(act.length) MEMBERS=act; } }catch(e){}
  try{ fbDb.collection('meta').doc('members').onSnapshot(doc=>{ if(doc.exists&&Array.isArray(doc.data().list)){ const act=doc.data().list.filter(x=>x&&x.name&&x.active!==false).map(x=>x.name); if(act.length){ MEMBERS=act; rmRerender(); } } },()=>{}); }catch(e){}
  RM={uid:u.uid, member:d.member, owner:isOwner, others:isOwner||!!d.setlistOthers};
  me=d.member; ui.viewOwner=null;
  state=defaults(); ui.setId=null;
  document.documentElement.classList.add('rm');
  render();
  setStatus('Lade …');
  try{ await rmMigrate(); }catch(e){ console.warn('Übernahme fehlgeschlagen',e); }
  rmSubscribe();
}
async function rmMigrate(){
  const lib=await libRef().get();
  if(lib.exists||!RM.owner) return;
  // Einmalig: Daten der alten Version (ein gemeinsames Dokument) aufteilen
  let o=null;
  try{ const old=await fbDb.collection('setlist').doc('state').get(); if(old.exists) o=JSON.parse(old.data().state); }catch(e){ o=null; }
  if(!o){ try{ const l=localStorage.getItem(LS); if(l) o=JSON.parse(l); }catch(e){} }
  o=o||{};
  const ownPresets={}; (o.songs||[]).forEach(x=>{ if(x.preset){ ownPresets[x.id]=x.preset; delete x.preset; } });
  o.myPreset=o.myPreset||{}; o.myPreset[me]=Object.assign(ownPresets,o.myPreset[me]||{});
  const batch=fbDb.batch();
  batch.set(libRef(),{songs:JSON.stringify(o.songs||[]), bandName:(o.settings&&o.settings.bandName)||'Who Knows?', updated:Date.now()});
  (o.setlists||[]).forEach(sl=>{ const c=Object.assign({},sl,{owner:sl.owner||me}); batch.set(setsCol().doc(c.id),setDocData(c)); });
  const people=new Set([...Object.keys(o.myNotes||{}),...Object.keys(o.myCtrl||{}),...Object.keys((o.settings||{}).pdfUser||{}),...Object.keys(o.myPreset||{})]);
  people.forEach(m=>{ batch.set(fbDb.collection('setlistNotes').doc(m),{notes:JSON.stringify((o.myNotes||{})[m]||{}),ctrl:JSON.stringify((o.myCtrl||{})[m]||{}),pdf:JSON.stringify(((o.settings||{}).pdfUser||{})[m]||null),preset:JSON.stringify((o.myPreset||{})[m]||{}),updated:Date.now()}); });
  await batch.commit();
  if((o.setlists||[]).length||(o.songs||[]).length) toast('Bisherige Setlisten & Songs übernommen ✓');
}
function rmRerender(){ if(!document.activeElement||!document.activeElement.matches('input,textarea')) render(); else pendingRender=true; }
function rmSubscribe(){
  const err=e=>{ console.warn(e); setStatus(e&&e.code==='permission-denied'?'Keine Berechtigung – Firestore-Regeln aktuell? (README 9.3)':'Verbindung gestört'); };
  libRef().onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites) return;
    const d=snap.exists?snap.data():{};
    let songs=[]; try{ songs=JSON.parse(d.songs||'[]'); }catch(e){}
    const j=JSON.stringify({songs,bandName:d.bandName||'Who Knows?'});
    if(j===rmLastLib||dirty) return;
    rmLastLib=j; state.songs=songs; state.settings.bandName=d.bandName||'Who Knows?';
    if(RM.owner&&songs.some(x=>x.preset)){ rmPendingPresets=true; }
    if(rmPendingPresets&&rmNotesLoaded){ rmPendingPresets=false; if(movePresetsTo(me)) commit(false); }
    setStatus('Angemeldet als '+me+' ✓'); rmRerender();
  },err);
  const q=RM.others?setsCol():setsCol().where('owner','==',me);
  q.onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites) return;
    if(dirty) return;
    const list=[], last={}, meta={};
    snap.docs.forEach(doc=>{ const d=doc.data(); let sl=null; try{ sl=JSON.parse(d.data); }catch(e){} if(!sl) return;
      sl.id=doc.id; sl.owner=d.owner; sl.from=d.from||sl.from||''; if(!Array.isArray(sl.items)) sl.items=[];
      list.push(sl); last[doc.id]=JSON.stringify(sl); meta[doc.id]={owner:d.owner,from:d.from||''}; });
    state.setlists=list; rmLastSet=last; rmSetMeta=meta; rmRerender();
  },err);
  notesRef().onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites) return;
    if(dirty) return;
    const d=snap.exists?snap.data():{};
    const P=(x,def)=>{ try{ const v=JSON.parse(x); return v==null?def:v; }catch(e){ return def; } };
    state.myNotes={[me]:P(d.notes,{})}; state.myCtrl={[me]:P(d.ctrl,{})}; state.myPreset={[me]:P(d.preset,{})};
    const pdf=P(d.pdf,null); state.settings.pdfUser=pdf?{[me]:pdf}:{};
    rmNotesLoaded=true;
    if(rmPendingPresets){ rmPendingPresets=false; setTimeout(()=>{ if(movePresetsTo(me)) commit(false); },0); }
    rmLastNotes=JSON.stringify([state.myNotes[me],state.myCtrl[me],pdf,state.myPreset[me]]); rmRerender();
  },err);
}
async function rmFlush(){
  if(rmSaving){ rmAgain=true; return; }
  rmSaving=true; setStatus('Speichere …');
  try{
    const libJ=JSON.stringify({songs:state.songs,bandName:state.settings.bandName});
    if(libJ!==rmLastLib){ await libRef().set({songs:JSON.stringify(state.songs),bandName:state.settings.bandName,updated:Date.now()}); rmLastLib=libJ; }
    const ids=new Set();
    for(const sl of state.setlists){
      ids.add(sl.id);
      if(!sl.owner) sl.owner=me;
      if(isRO(sl)) continue;
      const j=JSON.stringify(sl);
      if(rmLastSet[sl.id]!==j){ await setsCol().doc(sl.id).set(setDocData(sl)); rmLastSet[sl.id]=j; rmSetMeta[sl.id]={owner:sl.owner,from:sl.from||''}; }
    }
    for(const id of Object.keys(rmLastSet)){
      if(ids.has(id)) continue;
      const m=rmSetMeta[id]||{};
      if(RM.owner||m.owner===me||m.from===me){ await setsCol().doc(id).delete(); }
      delete rmLastSet[id]; delete rmSetMeta[id];
    }
    const pdf=(state.settings.pdfUser||{})[me]||null;
    const nj=JSON.stringify([(state.myNotes||{})[me]||{},(state.myCtrl||{})[me]||{},pdf,(state.myPreset||{})[me]||{}]);
    if(nj!==rmLastNotes){ await notesRef().set({notes:JSON.stringify((state.myNotes||{})[me]||{}),ctrl:JSON.stringify((state.myCtrl||{})[me]||{}),pdf:JSON.stringify(pdf),preset:JSON.stringify((state.myPreset||{})[me]||{}),updated:Date.now()}); rmLastNotes=nj; }
    setStatus('Gespeichert ✓');
  }catch(e){
    console.warn(e);
    setStatus(e&&e.code==='permission-denied'?'Keine Berechtigung zum Speichern':'Nicht gespeichert – Verbindung?');
  }
  rmSaving=false; dirty=false;
  if(rmAgain){ rmAgain=false; rmFlush(); }
}
async function rmAssign(sl,who){
  const fresh=()=>sl.items.map(it=>it.type==='break'?{id:uid(),type:'break',kind:it.kind||(isEncore(it)?'encore':'break'),label:it.label}:{id:uid(),type:'song',songId:it.songId,note:''});
  const ok=[],bad=[];
  for(const n of who){
    const c={id:sl.id+'__'+n,owner:n,from:me,sourceId:sl.id,name:sl.name,date:sl.date,venue:sl.venue,items:fresh(),created:Date.now(),assigned:Date.now()};
    try{ await setsCol().doc(c.id).set(setDocData(c)); ok.push(n); }catch(e){ console.warn(e); bad.push(n); }
  }
  toast((ok.length?'Zugewiesen an '+ok.join(', '):'')+(bad.length?(ok.length?' · ':'')+'Nicht möglich bei: '+bad.join(', '):''));
}

let pendingRender=false;
document.addEventListener('focusout',()=>{ if(pendingRender){ pendingRender=false; setTimeout(()=>{ if(!document.activeElement.matches('input,textarea')) render(); },0);} });

let dlNs;
async function downloadsNs(){ if(dlNs!==undefined) return dlNs; try{ dlNs=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null; }catch(e){dlNs=null;} return dlNs; }
async function saveFile(filename,data,mime){
  const dl=await downloadsNs();
  if(dl){
    try{ await dl.save({filename,data}); toast('Gespeichert: '+filename); return true; }
    catch(e){ if(e&&e.code==='declined') return false; }
  }
  // Fallback, z. B. wenn die Datei direkt im Browser geöffnet wird
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
    const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=filename;
    a.rel='noopener'; a.style.display='none'; document.body.appendChild(a); a.click(); setTimeout(()=>{ a.remove(); URL.revokeObjectURL(u); },30000);
    if(!dl){ dlNs=false; toast('Gespeichert: '+filename); return true; }
  }catch(e){}
  return false;
}

/* ---------- UI primitives ---------- */
let toastT;
function toast(msg){ clearTimeout(toastT); let el=$('#toast'); if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el);} el.textContent=msg; el.style.display='block'; toastT=setTimeout(()=>el.style.display='none',2600); }
function modal(html,onMount,sticky){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">${html}</div>`;
  if(!sticky) bg.addEventListener('mousedown',e=>{ if(e.target===bg) close(); });
  function close(){ bg.remove(); document.removeEventListener('keydown',key); }
  function key(e){ if(e.key==='Escape'&&!sticky) close(); }
  document.addEventListener('keydown',key);
  $('#layer').appendChild(bg); if(onMount) onMount(bg.querySelector('.modal'),close);
  const f=bg.querySelector('[autofocus]'); if(f) f.focus();
  return close;
}
function ask(msg,ok){ return new Promise(res=>{ modal(`<h2>Sicher?</h2><p>${msg}</p><div class="mfoot"><button class="btn" data-x="0">Abbrechen</button><button class="btn pri" data-x="1">${esc(ok||'OK')}</button></div>`,(m,close)=>{ m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{close();res(b.dataset.x==='1');}); }); }); }

function renderSettings(){
  $('#app').innerHTML=`<div style="max-width:620px;display:grid;gap:16px">
    <div class="card"><h3>Band</h3><label class="f">Bandname (steht oben im PDF)</label><input type="text" id="bandName" value="${esc(state.settings.bandName)}"></div>
    <div class="card"><h3>Backup</h3>

      <div class="row"><button class="btn" data-act="exportJson">Backup herunterladen</button><button class="btn" data-act="exportCsv">Songs als CSV</button>${!RM||RM.owner?'<label class="btn">Backup einspielen<input type="file" id="imp" accept=".json,application/json" hidden></label>':''}</div></div>
  </div>`;
  $('#bandName').oninput=e=>{ state.settings.bandName=e.target.value; commit(false); };
  if($('#imp')) $('#imp').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{ const d=JSON.parse(await f.text()); if(!d||!Array.isArray(d.songs)) throw 0;
      if(await ask(`Backup mit ${d.songs.length} Songs und ${(d.setlists||[]).length} Setlisten einspielen? Der aktuelle Stand wird ersetzt.`,'Einspielen')){
        if(RM){ // persönliche Notizen aller Personen in ihre eigenen Dokumente
          const people=new Set([...Object.keys(d.myNotes||{}),...Object.keys(d.myCtrl||{}),...Object.keys((d.settings||{}).pdfUser||{})]);
          const batch=fbDb.batch();
          Object.keys(d.myPreset||{}).forEach(m=>people.add(m));
          people.forEach(m=>{ if(m===me) return; batch.set(fbDb.collection('setlistNotes').doc(m),{notes:JSON.stringify((d.myNotes||{})[m]||{}),ctrl:JSON.stringify((d.myCtrl||{})[m]||{}),pdf:JSON.stringify(((d.settings||{}).pdfUser||{})[m]||null),preset:JSON.stringify((d.myPreset||{})[m]||{}),updated:Date.now()}); });
          try{ await batch.commit(); }catch(err){ console.warn(err); }
          (d.setlists||[]).forEach(x=>{ if(!x.owner) x.owner=me; });
          ui.viewOwner='*';
        }
        merge(d); ui.setId=null; commit(); toast('Backup eingespielt'); }
    }catch(err){ toast('Das ist keine gültige Backup-Datei.'); }
    e.target.value='';
  };
}

/* ---------- bulk import ---------- */
function bulkDialog(){
  const sl=ui.tab==='sets'?curSet():null;
  modal(`<h2>Liste einfügen</h2>
    <p class="stats">Ein Song pro Zeile. Nummern am Anfang werden ignoriert. Format: <b>Titel</b> oder <b>Titel - Interpret</b>, für mehr Details: <b>Titel | Interpret | Tonart | Preset | Länge</b></p>
    <textarea rows="10" id="bulkTxt" autofocus placeholder="1. Zombie - The Cranberries&#10;2. Paranoid - Black Sabbath&#10;3. Ring of Fire | Social Distortion | G | 07 | 3:30"></textarea>
    ${sl?`<label class="check"><input type="checkbox" id="bulkAdd" checked> Auch in dieser Reihenfolge zu „${esc(sl.name||'Setliste')}“ hinzufügen</label>`:''}
    <p class="stats">Songs, die es schon gibt (gleicher Titel), werden nicht doppelt angelegt.</p>
    <div class="mfoot"><button class="btn" data-x="c">Abbrechen</button><button class="btn pri" data-x="ok">Übernehmen</button></div>`,(m,close)=>{
    m.querySelector('[data-x=c]').onclick=close;
    m.querySelector('[data-x=ok]').onclick=()=>{
      const add=sl&&m.querySelector('#bulkAdd').checked; let created=0,added=0;
      m.querySelector('#bulkTxt').value.split(/\r?\n/).forEach(line=>{
        line=line.replace(/^\s*\d+[.)\-:]?\s+/,'').trim(); if(!line) return;
        if(/^(pause|break|---+|set\s*\d*|zugabe|encore)$/i.test(line)){ if(add){ const e=/zugabe|encore/i.test(line); sl.items.push({id:uid(),type:'break',kind:e?'encore':'break',label:e?'Zugabe':line.replace(/^-+$/,'Pause')}); } return; }
        let title,artist='',key='',preset='',dur=0;
        if(line.includes('|')){ const p=line.split('|').map(x=>x.trim()); [title,artist='',key='',preset='']=p; dur=parseDur(p[4]); }
        else { const i=line.indexOf(' - '); if(i>0){title=line.slice(0,i).trim();artist=line.slice(i+3).trim();} else title=line; }
        if(!title) return;
        let s=findSongByTitle(title);
        if(!s){ s={id:uid(),title,artist,key,tuning:'',bpm:'',dur,notes:''}; state.songs.push(s); created++; }
        if(preset) setMyPreset(s.id,preset);
        if(add){ sl.items.push({id:uid(),type:'song',songId:s.id,note:''}); added++; }
      });
      close(); commit(); toast(`${created} neue Songs angelegt${add?`, ${added} zur Setliste hinzugefügt`:''}`);
    };
  });
}

  modal(`<h2>„${esc(sl.name||'Setliste')}“ zuweisen</h2>

    <div class="mgrid" style="gap:0 14px">${others.map(n=>`<label class="check"><input type="checkbox" name="m" value="${esc(n)}"> ${esc(n)}${has(n)?' <span class="stats" style="margin:0">(hat sie schon – wird aktualisiert)</span>':''}</label>`).join('')}</div>
    <div class="mfoot"><button class="btn" data-x="c">Abbrechen</button><button class="btn pri" data-x="ok">Zuweisen</button></div>`,(m,close)=>{
    const boxes=[...m.querySelectorAll('[name=m]')];
    m.querySelector('#allM').onchange=e=>boxes.forEach(b=>b.checked=e.target.checked);
    m.querySelector('[data-x=c]').onclick=close;
    m.querySelector('[data-x=ok]').onclick=()=>{
      const who=boxes.filter(b=>b.checked).map(b=>b.value);
      if(!who.length){ toast('Bitte mindestens ein Mitglied auswählen.'); return; }
      if(RM){ close(); rmAssign(sl,who); return; }
      const fresh=()=>sl.items.map(it=>it.type==='break'?{id:uid(),type:'break',kind:it.kind||(isEncore(it)?'encore':'break'),label:it.label}:{id:uid(),type:'song',songId:it.songId,note:''});
      let neu=0,upd=0;
      who.forEach(n=>{
        const ex=has(n);
        if(ex){ Object.assign(ex,{name:sl.name,date:sl.date,venue:sl.venue,items:fresh(),from:me,assigned:Date.now()}); upd++; }
        else { state.setlists.push({id:uid(),owner:n,from:me,sourceId:sl.id,name:sl.name,date:sl.date,venue:sl.venue,items:fresh(),created:Date.now(),assigned:Date.now()}); neu++; }
      });
      close(); commit(false);
      toast(`Zugewiesen an ${who.join(', ')}`+(upd?` (${upd}× aktualisiert)`:''));
    };
  });

/* ---------- text / pdf ---------- */
function setAsText(sl){
  let nr=0; const lines=[`${state.settings.bandName} – ${sl.name||'Setliste'}`];
  const sub=[fmtDate(sl.date),sl.venue].filter(Boolean).join(', '); if(sub) lines.push(sub); lines.push('');
  sl.items.forEach(it=>{ if(it.type==='break'){ lines.push('', `--- ${it.label||'Pause'} ---`, ''); return; } const s=songById(it.songId); if(!s) return; nr++; lines.push(`${nr}. ${s.title}${s.artist?' ('+s.artist+')':''}${it.note?' – '+it.note:''}`); });
  const st=setStats(sl); lines.push('', `${st.n} Songs${st.t?', ca. '+fmtDur(st.t):''}`);
  return lines.join('\n');

    while(tfs>8 && doc.getTextWidth(title)>maxW){ tfs-=0.25; doc.setFontSize(tfs); }
    doc.setTextColor(...C.ink); doc.text(title,x0,base);
    if(r.artist){ const tw=doc.getTextWidth(title); doc.setFont('helvetica','normal'); doc.setFontSize(metaFs(fs)); doc.setTextColor(...C.meta); const rest=maxW-tw-6; if(rest>30){ let a=pdfSafe(r.artist); while(a.length>3&&doc.getTextWidth(a)>rest) a=a.slice(0,-4)+'...'; doc.text(a,x0+tw+6,base); } }
    if(!two&&(r.note||r.ctrl)){ const f=Math.max(8,fs*0.42), ny=base+f*1.25; doc.setFont(NF,NS); doc.setFontSize(f);
      let nx=x0; if(r.note){ let t=pdfSafe(r.note); const room=leftR-x0-(r.ctrl?doc.getTextWidth(r.ctrl)+12:0); while(t.length>4&&doc.getTextWidth(t)>room) t=t.slice(0,-4)+'...'; doc.setTextColor(...C.ink); doc.text(t,x0,ny); nx=x0+doc.getTextWidth(t)+12; }
      if(r.ctrl){ doc.setTextColor(...C.ctrl); doc.text(r.ctrl,nx,ny); } }
    if(two){
      const ly0=y+nfs*0.25+nfs*0.9;
      if(r._lines&&r._lines.length){ doc.setFont(NF,NS); doc.setFontSize(nfs); doc.setTextColor(...C.ink);
        doc.text(r._lines,rightX,ly0,{lineHeightFactor:1.13}); }
      if(r.ctrl){ doc.setFont(NF,NS); doc.setFontSize(nfs); doc.setTextColor(...C.ctrl); const n=r._lines.length;
        if(r._ctrlSame) doc.text(r.ctrl,rightX+doc.getTextWidth(r._lines[n-1]+'   '),ly0+(n-1)*nfs*1.13);
        else doc.text(r.ctrl,rightX,ly0+n*nfs*1.13); }
      doc.setDrawColor(...C.rule); doc.setLineWidth(0.6); doc.line(split,y+2,split,y+rh-2);
    }
    y+=rh;
  });
  const st=setStats(sl); const pages=doc.getNumberOfPages();
  for(let p=1;p<=pages;p++){ doc.setPage(p); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...C.meta);
    if(o.footer) doc.text(`${st.n} Songs${st.t?'  ·  ca. '+fmtDur(st.t):''}`,M,H-M+6);
    if(pages>1) doc.text(`Seite ${p}/${pages}`,W-M,H-M+6,{align:'right'}); }
  return doc;
}
function fileBase(sl){ return ([sl.date,sl.name||'Setliste'].filter(Boolean).join(' ')).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss').replace(/[^A-Za-z0-9 ._()-]+/g,'').replace(/ +/g,' ').trim()||'Setliste'; }
const PDF_FIELDS=[['color','🎨 Farbig'],['myNotes','Meine Notizen / Akkorde'],['ctrl','CTRL-Hinweise (rot &amp; fett)'],['numbers','Nummern'],['artist','Interpret'],['key','Tonart'],['preset','Mein Preset'],['tuning','Stimmung'],['bpm','Tempo (BPM)'],['dur','Songlänge'],['gigNotes','Gig-Notizen (nur diese Setliste)'],['songNotes','Song-Notizen (für alle)'],['breaks','Pausen &amp; Zugabe'],['footer','Anzahl &amp; Gesamtzeit unten']];
const PDF_QUICK={stage:{color:true,layout:'list',myNotes:false,ctrl:false,numbers:true,artist:false,key:false,preset:false,tuning:false,bpm:false,dur:false,gigNotes:false,songNotes:false,breaks:true,footer:false,size:'auto'},
  guitar:{color:true,layout:'notes',myNotes:true,ctrl:true,numbers:true,artist:false,key:true,preset:true,tuning:true,bpm:false,dur:false,gigNotes:true,songNotes:false,breaks:true,footer:false,size:'auto'},
  full:{color:true,layout:'notes',myNotes:true,ctrl:true,numbers:true,artist:true,key:true,preset:true,tuning:true,bpm:true,dur:true,gigNotes:true,songNotes:true,breaks:true,footer:true,size:'auto'}};
function pdfDialog(sl){
  if(!window.jspdf){ toast('PDF-Baustein lädt nicht – Internetverbindung prüfen.'); return; }
  const o=getPdfOpts();
  modal(`<h2>Drucken – ${esc(sl.name||'Setliste')}</h2>
    <p class="stats">Was soll aufs Blatt? Deine Auswahl wird für dich gemerkt.</p>
    <div class="row" style="margin-bottom:10px"><span class="stats" style="margin:0">Schnellwahl:</span><button class="btn sm" data-q="stage">Nur Titel</button><button class="btn sm" data-q="guitar">Gitarre (Preset, Tonart, Notizen)</button><button class="btn sm" data-q="full">Alles</button></div>
    <div class="mgrid" style="gap:0 14px">${PDF_FIELDS.map(([k,l])=>`<label class="check"><input type="checkbox" name="${k}" ${o[k]?'checked':''}> ${l}</label>`).join('')}</div>
    <div style="margin-top:12px"><label class="f">Aufbau</label><select name="layout">
      <option value="notes" ${o.layout==='notes'?'selected':''}>Songs links, Notizen rechts</option>
      <option value="list" ${o.layout==='list'?'selected':''}>Nur Songliste (Notizen klein unter dem Titel)</option></select></div>
    <div style="margin-top:10px"><label class="f">Schriftgröße</label><select name="size">
      <option value="auto" ${o.size==='auto'?'selected':''}>So groß wie möglich (eine Seite)</option>
      <option value="l" ${o.size==='l'?'selected':''}>Groß</option>
      <option value="m" ${o.size==='m'?'selected':''}>Mittel</option></select></div>
    <div class="mfoot"><button class="btn" data-x="c">Abbrechen</button><button class="btn pri" data-x="go">PDF erstellen</button></div>`,(m,close)=>{
    const apply=v=>{ PDF_FIELDS.forEach(([k])=>m.querySelector(`[name=${k}]`).checked=!!v[k]); m.querySelector('[name=size]').value=v.size||'auto'; m.querySelector('[name=layout]').value=v.layout||'notes'; };
    m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>apply(PDF_QUICK[b.dataset.q]));
    m.querySelector('[data-x=c]').onclick=close;
    m.querySelector('[data-x=go]').onclick=()=>{
      const v={}; PDF_FIELDS.forEach(([k])=>v[k]=m.querySelector(`[name=${k}]`).checked); v.size=m.querySelector('[name=size]').value; v.layout=m.querySelector('[name=layout]').value;
      if(me){ state.settings.pdfUser[me]=v; commit(false); }
      close(); pdfPreview(sl,v);
    };
  });
}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsP=null;
function loadScript(src){ return new Promise((res,rej)=>{ const el=document.createElement('script'); el.src=src; el.onload=res; el.onerror=rej; document.head.appendChild(el); }); }
function loadPdfjs(){
  if(!pdfjsP) pdfjsP=(async()=>{
    if(!window.pdfjsWorker) await loadScript(PDFJS+'pdf.worker.min.js');   // läuft im Hauptthread (kein Web-Worker nötig)
    if(!window.pdfjsLib) await loadScript(PDFJS+'pdf.min.js');
    const lib=window.pdfjsLib; if(!lib) throw new Error('pdf.js fehlt');
    try{ lib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; }catch(e){}
    return lib;
  })().catch(e=>{ pdfjsP=null; throw e; });
  return pdfjsP;
}
async function renderPreview(blob,box){
  try{
    const lib=await loadPdfjs();
    const pdf=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer()),isEvalSupported:false}).promise;
    box.innerHTML='';
    const w=Math.max(280,box.clientWidth-24), dpr=Math.min(2.5,window.devicePixelRatio||1);
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i); const v0=page.getViewport({scale:1});
      const vp=page.getViewport({scale:(w/v0.width)*dpr});
      const c=document.createElement('canvas'); c.width=Math.round(vp.width); c.height=Math.round(vp.height); c.style.width=w+'px';
      box.appendChild(c);
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }
  }catch(e){ box.innerHTML='<div class="pvmsg">Die Vorschau lässt sich hier nicht anzeigen.<br>Das PDF selbst ist fertig – einfach herunterladen.</div>'; }
}
function pdfPreview(sl,o){
  let doc; try{ doc=buildPdf(sl,o); }catch(e){ toast('PDF konnte nicht erstellt werden.'); return; }
  const blob=doc.output('blob'); const url=URL.createObjectURL(blob);
  modal(`<h2>PDF – ${esc(sl.name||'Setliste')}</h2>
    <div class="pdfprev" id="pv"><div class="pvmsg">Vorschau wird erstellt …</div></div>
    <p class="stats">${window.claude?'Zum Drucken: PDF herunterladen, öffnen und ausdrucken.':'„Drucken“ öffnet das PDF in einem neuen Tab – dort über das Drucker-Symbol drucken.'}</p>
    <div class="mfoot"><button class="btn left" data-x="opt">‹ Optionen ändern</button><button class="btn" data-x="c">Schließen</button>${window.claude?'':'<button class="btn" data-x="pr">🖨 Drucken</button>'}<button class="btn pri" data-x="dl">PDF herunterladen</button></div>`,(m,close)=>{
    const pr=m.querySelector('[data-x=pr]'); if(pr) pr.onclick=()=>{ const w=window.open(url,'_blank'); if(!w) toast('Pop-up blockiert – bitte herunterladen und drucken.'); };
    renderPreview(blob,m.querySelector('#pv'));
    const done=()=>{close();setTimeout(()=>URL.revokeObjectURL(url),60000);};
    m.querySelector('[data-x=c]').onclick=done;
    m.querySelector('[data-x=opt]').onclick=()=>{done();pdfDialog(sl);};
    m.querySelector('[data-x=dl]').onclick=async()=>{ const ok=await saveFile(fileBase(sl)+'.pdf',blob); if(!ok && !dlNs) toast('Download ist hier nicht verfügbar – öffne die Seite direkt auf claude.ai.'); };
  });
}

/* ---------- stage view ---------- */
function stageView(sl){
  const items=sl.items.map(it=>it.type==='break'?{brk:true,enc:isEncore(it),label:it.label||'Pause'}:(()=>{const s=songById(it.songId);return s?{s,note:it.note}:null;})()).filter(Boolean);
  if(!items.length){ toast('Setliste ist leer.'); return; }
  let i=0; const el=document.createElement('div'); el.className='stage'; document.body.appendChild(el);
  const nrOf=k=>items.slice(0,k+1).filter(x=>!x.brk).length;
  const total=items.filter(x=>!x.brk).length;
  function draw(){
    const c=items[i],n=items[i+1];
    const meta=c.brk?'':[c.s.key,myPreset(c.s.id)&&'Preset '+myPreset(c.s.id),c.s.tuning,c.s.bpm&&c.s.bpm+' BPM'].filter(Boolean).map(esc).join('  ·  ');
    const note=c.brk?'':(c.note||c.s.notes||'');
    el.innerHTML=`<div class="top"><span>${esc(sl.name||'')}</span><span>${c.brk?'':nrOf(i)+' / '+total}</span><button class="ico" data-close style="font-size:22px">✕</button></div>
      <div class="cur" data-next>${c.brk?`<div class="big" style="color:${c.enc?'#ff5252':'var(--acc)'}">${c.enc?'★ ':''}${esc(c.label)}${c.enc?' ★':''}</div>`:`<div class="bnr">${nrOf(i)}</div><div class="big">${esc(c.s.title)}</div>${meta?`<div class="meta">${meta}</div>`:''}${note?`<div class="snote">${esc(note)}</div>`:''}${myCtrl(c.s.id)?`<div class="ctrl">CTRL: ${esc(myCtrl(c.s.id))}</div>`:''}${myNote(c.s.id)?`<div class="chords">${esc(myNote(c.s.id))}</div>`:''}`}</div>
      <div class="next">${n?`Danach: <b>${esc(n.brk?n.label:n.s.title)}</b>${!n.brk&&myPreset(n.s.id)?' · Preset '+esc(myPreset(n.s.id)):''}`:'Letzter Song 🤘'}</div>
      <div class="nav"><button class="btn" data-prev>‹ Zurück</button><button class="btn" data-nx>Weiter ›</button></div>`;
  }
  const go=d=>{ i=Math.max(0,Math.min(items.length-1,i+d)); draw(); };
  function close(){ el.remove(); document.removeEventListener('keydown',key); }
  function key(e){ if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();go(1);} else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1);} else if(e.key==='Escape') close(); }
  el.addEventListener('click',e=>{ if(e.target.closest('[data-close]')) close(); else if(e.target.closest('[data-prev]')) go(-1); else if(e.target.closest('[data-nx]')||e.target.closest('[data-next]')) go(1); });
  document.addEventListener('keydown',key);
  try{ el.requestFullscreen&&el.requestFullscreen().catch(()=>{}); }catch(e){}
  draw();
}

/* ---------- events ---------- */
document.getElementById('nav').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b){ ui.tab=b.dataset.tab; render(); } });
document.getElementById('app').addEventListener('input',e=>{
  const t=e.target, sl=curSet();
  if(t.dataset.set && sl){ sl[t.dataset.set]=t.value; commit(false); }
  else if(t.dataset.ctrl){ setMyCtrl(t.dataset.ctrl,t.value); commit(false); }
  else if(t.dataset.my){ setMyNote(t.dataset.my,t.value); commit(false); }
  else if(t.dataset.edit && sl){ const it=sl.items[+t.dataset.i]; if(it){ it[t.dataset.edit]=t.value; commit(false); } }
});
document.getElementById('app').addEventListener('change',e=>{ if(e.target.dataset.set){ const a=$('#asideBox'); if(a) a.outerHTML=asideHtml(); } });
document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  doAct(b);
});
async function doAct(b){
  const act=b.dataset.act, sl=curSet(), i=+b.dataset.i;
  switch(act){
    case 'more': moreSheet(); break;
    case 'addSheet': addSheet(); break;
    case 'copyMine':{ const c=JSON.parse(JSON.stringify(sl)); c.id=uid(); c.owner=me; c.from=''; c.sourceId=''; c.name=(sl.name||'Setliste'); c.created=Date.now(); c.items.forEach(x=>x.id=uid()); state.setlists.push(c); ui.viewOwner=null; ui.setId=c.id; commit(); toast('Kopie in deinen Setlisten angelegt'); break; }
    case 'newSet':{ ui.viewOwner=null; const s={id:uid(),owner:me,name:'Neue Setliste',date:new Date().toISOString().slice(0,10),venue:'',items:[],created:Date.now()}; state.setlists.push(s); ui.setId=s.id; commit(); const n=document.querySelector('[data-set=name]'); if(n){n.focus();n.select();} break; }
    case 'pickSet': ui.setId=b.dataset.id; render(); break;
    case 'assign': assignDialog(sl); break;
    case 'dupSet':{ const c=JSON.parse(JSON.stringify(sl)); c.id=uid(); c.owner=me; c.from=''; ui.viewOwner=null; c.name=(sl.name||'Setliste')+' (Kopie)'; c.created=Date.now(); c.items.forEach(x=>x.id=uid()); state.setlists.push(c); ui.setId=c.id; commit(); toast('Kopie angelegt'); break; }
    case 'delSet': if(await ask(`Setliste „${esc(sl.name)}“ löschen? Die Songs bleiben in deiner Song-Liste.`,'Löschen')){ state.setlists=state.setlists.filter(x=>x.id!==sl.id); ui.setId=null; commit(); } break;
    case 'addSong': sl.items.push({id:uid(),type:'song',songId:b.dataset.id,note:''}); commit(); { const q=$('#addQ'); if(q&&ui.addQ){ q.focus(); q.select(); } } break;
    case 'quickNew': songDialog(null,s=>{ curSet().items.push({id:uid(),type:'song',songId:s.id,note:''}); ui.addQ=''; }); setTimeout(()=>{ const t=document.querySelector('.modal [name=title]'); if(t) t.value=ui.addQ.trim(); },0); break;
    case 'addEncore': sl.items.push({id:uid(),type:'break',kind:'encore',label:'Zugabe'}); commit(); break;
    case 'addBreak':{ const n=sl.items.filter(x=>x.type==='break').length; sl.items.push({id:uid(),type:'break',kind:'break',label:n?'Pause '+(n+1):'Pause'}); commit(); break; }
    case 'rm': sl.items.splice(i,1); commit(); break;
    case 'openNote': ui.openNote=b.dataset.id; render(); { const ta=document.querySelector('.mynote'); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); } } break;
    case 'closeNote': ui.openNote=null; render(); break;
    case 'up': if(i>0){ [sl.items[i-1],sl.items[i]]=[sl.items[i],sl.items[i-1]]; commit(); } break;
    case 'down': if(i<sl.items.length-1){ [sl.items[i+1],sl.items[i]]=[sl.items[i],sl.items[i+1]]; commit(); } break;
    case 'editSong': songDialog(songById(b.dataset.id)); break;
    case 'newSong': songDialog(null); break;
    case 'bulk': bulkDialog(); break;
    case 'pdf': pdfDialog(sl); break;
    case 'stage': stageView(sl); break;
    case 'copyText':{ const txt=setAsText(sl); try{ await navigator.clipboard.writeText(txt); toast('Setliste kopiert – z. B. in WhatsApp einfügen'); }catch(err){ modal(`<h2>Setliste als Text</h2><textarea rows="14" readonly>${esc(txt)}</textarea><div class="mfoot"><button class="btn pri" data-x>Schließen</button></div>`,(m,close)=>{ m.querySelector('[data-x]').onclick=close; const ta=m.querySelector('textarea'); ta.focus(); ta.select(); }); } break; }
    case 'exportJson':{ const ok=await saveFile('setlist-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2)); if(!ok&&!dlNs) toast('Download ist hier nicht verfügbar.'); break; }
    case 'exportCsv':{ const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"'; const csv='﻿Titel;Interpret;Tonart;Mein Preset;Stimmung;BPM;Länge;Notizen\n'+state.songs.map(s=>[s.title,s.artist,s.key,myPreset(s.id),s.tuning,s.bpm,fmtDur(s.dur),s.notes].map(q).join(';')).join('\n'); const ok=await saveFile('songs.csv',csv); if(!ok&&!dlNs) toast('Download ist hier nicht verfügbar.'); break; }
  }
}


function pickUser(force){
  modal(`<h2>Wer bist du?</h2><p class="stats">Du siehst dann nur deine eigenen Setlisten. Wechseln kannst du jederzeit oben rechts.</p><div class="pickgrid">${MEMBERS.map(n=>`<button class="btn ${n===me?'pri':''}" data-n="${n}">${n}</button>`).join('')}</div>`,(m,close)=>{
    m.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ setMe(b.dataset.n); close(); });
  },!!force);
}
function setMe(n){ me=n; try{localStorage.setItem('setlist-user',n);}catch(e){} ui.setId=null; if(!RM&&!hasFirebase()&&movePresetsTo(me)) commit(false); render(); }
document.getElementById('who').addEventListener('change',e=>{ if(RM){ ui.viewOwner=e.target.value||null; ui.setId=null; render(); return; } if(MEMBERS.includes(e.target.value)) setMe(e.target.value); });
loadLocal(); if(me&&!hasFirebase()&&movePresetsTo(me)) saveLocal(); render(); initCloud(); if(!me&&!hasFirebase()) pickUser(true);
})();
